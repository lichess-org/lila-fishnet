name: deploy

on:
  workflow_dispatch:
    inputs:
      env:
        required: true
        type: choice
        options:
          - starr
  workflow_call:
    inputs:
      env:
        description: Target environment for deployment
        required: true
        type: string

jobs:

  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - name: Setup sbt
        uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9
      - run: sbt stage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lila-fishnet-app
          path: app/target/universal/stage

  deploy-app:
    runs-on: ubuntu-latest
    needs: stage
    environment:
      name: ${{ inputs.env }}
    strategy:
      fail-fast: false
    concurrency:
      group: deploy-${{ inputs.env }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lila-fishnet-app
          path: stage

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          echo "$SSH_HOST $SSH_HOST_KEY" > ~/.ssh/known_hosts
          cat >>~/.ssh/config <<END
          Host deploy-host
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
          END
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}

      - name: Deploy via SSH
        run: |
          set -euo pipefail
          if [ ! -d stage/bin ]; then
            echo "ERROR: Expected staged artifact (stage/bin) not found. You skipped build jobs via workflow_dispatch."
            exit 1
          fi
          RSYNC_OPTIONS="--archive --no-o --no-g --force --delete --progress --compress --checksum --verbose --exclude RUNNING_PID --exclude '.git/'"
          include="stage/bin stage/lib"
          echo "Deploying lila-fishnet"
          rsync $RSYNC_OPTIONS $include deploy-host:/home/lila-fishnet
          echo "rsync complete"

          echo "Restart lila-fishnet"
          ssh deploy-host "chmod +x /home/lila-fishnet/bin/lila-fishnet && chown -R lila-fishnet:lila-fishnet /home/lila-fishnet && systemctl restart lila-fishnet"

          echo "Deploy complete"
